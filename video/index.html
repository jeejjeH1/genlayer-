<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenVM Motion Piece</title>
<style>
@font-face{font-family:'SG';src:url(assets/fonts/SpaceGrotesk-700.ttf);font-weight:700}
@font-face{font-family:'SG';src:url(assets/fonts/SpaceGrotesk-500.ttf);font-weight:500}
@font-face{font-family:'JB';src:url(assets/fonts/JetBrainsMono-800.ttf);font-weight:800}
@font-face{font-family:'JB';src:url(assets/fonts/JetBrainsMono-500.ttf);font-weight:500}

html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);margin:auto;position:absolute;inset:0}
#play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff87ff;font:700 22px monospace;cursor:pointer;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play" hidden>CLICK TO PLAY WITH SOUND</div>
<audio id="snd" src="soundtrack.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="main.js"></script>
